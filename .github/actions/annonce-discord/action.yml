# Action composite réutilisable : annonce une release GitHub sur Discord (embed « shadowtalk »).
# Depuis ce dépôt : - uses: ./.github/actions/annonce-discord (workflow annonce-discord.yml). Depuis un module privé :
#   - uses: DjamZee/sr5-alpha/.github/actions/annonce-discord@dev
#     with:
#       tag: ${{ github.event.release.tag_name }}
#       type: module
#       webhook: ${{ secrets.DISCORD_WEBHOOK }}
# Référence : la branche par défaut du dépôt (voir la page de wiki « Annonces Discord »).
# En type « module », aucun lien GitHub : le manifeste (Dropbox) et les dépendances viennent du module.json au tag.
name: Annonce Discord d'une release
description: Poste sur Discord un embed qui annonce une release GitHub, ou affiche le JSON en mode à blanc.
inputs:
  tag:
    description: Tag de la release à annoncer
    required: true
  repo:
    description: Dépôt « propriétaire/nom » (défaut, le dépôt courant)
    default: ${{ github.repository }}
  type:
    description: « system » (défaut) ou « module »
    default: system
  manifest:
    description: Système, nom de l'asset manifeste (défaut system.json) ; module, chemin du module.json dans le dépôt (défaut module.json)
    default: ''
  wiki-url:
    description: Adresse du wiki (défaut, le wiki du dépôt)
    default: ''
  username:
    description: Nom affiché par le webhook
    default: Shadowtalker GhostFrame
  avatar-url:
    description: Image de l'avatar du webhook (Dropbox, lien direct raw=1)
    default: https://www.dropbox.com/scl/fi/n14eydrsyj6w02iz4cigb/.Valentina-GhostFrame-Nu-ez-Portrait.png?rlkey=v30p0a65098z1ip9k32wfbszq&raw=1
  thumbnail-url:
    description: Vignette de l'embed (vide = aucune)
    default: ''
  dry-run:
    description: « true » affiche le JSON au lieu de l'envoyer
    default: 'false'
  webhook:
    description: Adresse du webhook Discord (secret ; inutile à blanc)
    default: ''
  github-token:
    description: Jeton pour lire la release (indispensable pour un dépôt privé)
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Composer et envoyer l'annonce
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
        TYPE: ${{ inputs.type }}
        MANIFEST: ${{ inputs.manifest }}
        WIKI_URL: ${{ inputs.wiki-url }}
        USERNAME: ${{ inputs.username }}
        AVATAR_URL: ${{ inputs.avatar-url }}
        THUMBNAIL_URL: ${{ inputs.thumbnail-url }}
        DRY_RUN: ${{ inputs.dry-run }}
        DISCORD_WEBHOOK: ${{ inputs.webhook }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -n "$DISCORD_WEBHOOK" ]; then echo "::add-mask::$DISCORD_WEBHOOK"; fi
        node "$GITHUB_ACTION_PATH/annonce.mjs"
