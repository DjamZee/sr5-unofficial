# Contrôle complet (npm run check : lint, tests, CSS, compendiums, validations, versions) à chaque poussée sur la
# branche par défaut et sur chaque pull request. Les packs du Mégapack Lite se construisent hors Git
# (npm run build:megapack, sources privées) : sans eux, verify:megapack dit « contrôle sauté » et passe.
name: Contrôle

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.13.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all checks
        run: npm run check
